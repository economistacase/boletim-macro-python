name: Boletim Macroeconômico Semanal

on:
  schedule:
    # toda segunda-feira, 10:00 UTC = 07:00 BRT
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      data_ref:
        description: "Data de referência (AAAA-MM-DD). Vazio = hoje."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  gerar-boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Criar diretórios necessários
        run: mkdir -p logs output/dados output/tabelas charts

      - name: Rodar o time de agentes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DATA="${{ github.event.inputs.data_ref }}"
          if [ -z "$DATA" ]; then DATA=$(date -u +%F); fi
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          claude -p "/gerar-boletim $DATA" \
            --allowedTools "Bash,Read,Write,Edit,Agent" \
            2>&1 | tee logs/execucao.log

      - name: Configurar identidade do bot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit e push dos produtos gerados
        run: |
          # Busca os arquivos gerados em qualquer subdiretório da árvore de
          # trabalho — o agente pode colocar o .qmd (e o HTML resultante) em
          # subpastas como output/ em vez da raiz, então não assumimos local fixo.
          HTML_FOUND=$(find . -name "boletim_${DATA}.html" -not -path "./.git/*" 2>/dev/null | head -1)
          PDF_FOUND=$(find . -name "boletim_${DATA}.pdf" -not -path "./.git/*" 2>/dev/null | head -1)

          if [ -z "$HTML_FOUND" ] || [ ! -s "$HTML_FOUND" ]; then
            echo "::error::Arquivo boletim_${DATA}.html não encontrado na árvore de trabalho. A pipeline relatou sucesso, mas o produto não foi gerado."
            python python/registrar_erro.py "workflow" "Commit e push: boletim_${DATA}.html ausente ou vazio." || true
            exit 1
          fi
          if [ -z "$PDF_FOUND" ] || [ ! -s "$PDF_FOUND" ]; then
            echo "::error::Arquivo boletim_${DATA}.pdf não encontrado na árvore de trabalho. A pipeline relatou sucesso, mas o produto não foi gerado."
            python python/registrar_erro.py "workflow" "Commit e push: boletim_${DATA}.pdf ausente ou vazio." || true
            exit 1
          fi

          echo "HTML encontrado em: $HTML_FOUND"
          echo "PDF encontrado em: $PDF_FOUND"
          cp "$HTML_FOUND" index.html
          cp "$PDF_FOUND" boletim_latest.pdf

          git add logs/revisao.md logs/erros.md 2>/dev/null || true
          git add index.html boletim_latest.pdf

          if git diff --staged --quiet; then
            echo "Nada a publicar nesta rodada."
          else
            git commit -m "Boletim macro $DATA [bot]"
            git push
          fi

      - name: Anexar logs como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

      - name: Notificar falha via GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA=$(date -u +%F)
          gh issue create \
            --title "Falha no Boletim Macro $DATA" \
            --body "O workflow **${{ github.workflow }}** falhou na execução de $DATA. [Ver logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug" 2>/dev/null || \
          echo "Issue não criada (label 'bug' pode não existir). Verifique a aba Actions."
