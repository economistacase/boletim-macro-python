name: Boletim Macroeconômico Semanal

on:
  schedule:
    # (1) Cadencia semanal: seg a qui, 10:00 UTC = 07:00 BRT. O portao libera a
    # geracao em qualquer dia util dessa janela enquanto a semana ainda nao
    # tiver boletim publicado — e so nesse caso. Assim um feriado na segunda ou
    # uma falha na terca sao cobertos pelo dia seguinte, sem gerar boletim em
    # duplicidade quando a primeira tentativa deu certo.
    - cron: "0 10 * * 1-4"
    # (2) Divulgacao do IPCA: todo dia 8 a 15, 12:00 UTC = 09:00 BRT, mesma
    # janela do repositorio relatorio-ipca. A data de divulgacao varia de mes
    # para mes (em novembro/2026 o IBGE divulgou no dia 12), entao em vez de
    # apostar num dia fixo o portao verifica se a serie 433 ganhou mes novo e
    # so entao regenera. Sem isso, um boletim gerado na segunda ficaria com o
    # mes anterior ate a segunda seguinte, enquanto o Painel IPCA do mesmo
    # autor ja teria atualizado — dois produtos assinados dizendo coisas
    # diferentes sobre a inflacao corrente.
    - cron: "0 12 8-15 * *"
  workflow_dispatch:
    inputs:
      data_ref:
        description: "Data de referência (AAAA-MM-DD). Vazio = hoje."
        required: false
        default: ""

permissions:
  contents: write
  issues: write   # necessário para o passo de notificação abrir a issue de falha

# Dois gatilhos podem coincidir (p. ex. IPCA divulgado numa segunda). Sem isto,
# duas execucoes simultaneas disputariam o push.
concurrency:
  group: boletim-macro
  cancel-in-progress: false

jobs:
  verificar-dia-util:
    runs-on: ubuntu-latest
    outputs:
      rodar: ${{ steps.check.outputs.rodar }}
    steps:
      # fetch-depth: 0 porque o passo abaixo precisa do historico para achar
      # o commit do ultimo boletim publicado. O referencia_ipca.txt fica na
      # raiz e e consultado pelo gatilho do IPCA.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            python
            referencia_ipca.txt

      - name: Descobrir a data do último boletim publicado
        id: ultimo
        run: |
          # Assunto dos commits do bot: "Boletim macro AAAA-MM-DD [bot]".
          ASSUNTO=$(git log -1 --grep='^Boletim macro .* \[bot\]$' --pretty=%s || true)
          ULTIMO=$(printf '%s' "$ASSUNTO" | sed -nE 's/^Boletim macro ([0-9]{4}-[0-9]{2}-[0-9]{2}) \[bot\]$/\1/p')
          if [ -z "$ULTIMO" ]; then
            echo "::warning::Nao foi possivel determinar a data do ultimo boletim (assunto encontrado: '$ASSUNTO'). O portao usara a regra conservadora do 1o dia util."
          fi
          echo "data=$ULTIMO" >> "$GITHUB_OUTPUT"
          echo "Ultimo boletim publicado: ${ULTIMO:-<desconhecido>}"

      # Consulta barata (so stdlib, sem Quarto nem Claude Code) para saber se o
      # IPCA ganhou mes novo. Imprime key=value direto no GITHUB_OUTPUT; os
      # diagnosticos do script vao para stderr.
      - name: Verificar se o IPCA ganhou mês novo
        id: ipca
        run: python3 python/ipca_referencia.py referencia_ipca.txt >> "$GITHUB_OUTPUT"

      - name: Decidir se gera o boletim
        id: check
        run: |
          SEMANA=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SEMANA=true   # execução manual sempre roda
          else
            SEMANA=$(TZ=America/Sao_Paulo python3 python/dia_util.py "$(TZ=America/Sao_Paulo date +%F)" --ultimo-boletim "${{ steps.ultimo.outputs.data }}")
          fi
          # Um valor inesperado faria o job de geracao ser pulado em silencio —
          # exatamente o tipo de falha invisivel que queremos evitar. Melhor falhar.
          if [ "$SEMANA" != "true" ] && [ "$SEMANA" != "false" ]; then
            echo "::error::dia_util.py devolveu '$SEMANA' em vez de true/false. Abortando para nao pular a geracao silenciosamente."
            exit 1
          fi

          IPCA="${{ steps.ipca.outputs.ipca_novo }}"

          # Os dois gatilhos sao independentes: o do IPCA atravessa de proposito
          # a regra "a semana ja tem boletim", que e justamente o que deixava o
          # boletim defasado no dia da divulgacao.
          if [ "$SEMANA" = "true" ] || [ "$IPCA" = "true" ]; then
            RODAR=true
          else
            RODAR=false
          fi

          echo "rodar=$RODAR" >> "$GITHUB_OUTPUT"
          echo "Cadencia semanal pede geracao? $SEMANA"
          echo "IPCA com mes novo (${{ steps.ipca.outputs.ipca_atual }})? $IPCA"
          echo "Gerar boletim hoje? $RODAR"

  gerar-boletim:
    needs: verificar-dia-util
    if: needs.verificar-dia-util.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Criar diretórios necessários
        run: mkdir -p logs output/dados output/tabelas charts

      # Sem isto o Claude Code ignora permissions e hooks do .claude/settings.json
      # ("this workspace has not been trusted"), porque o dialogo de confianca e
      # interativo e nao existe terminal no runner.
      - name: Confiar no workspace (ativa .claude/settings.json)
        run: python python/confiar_workspace.py

      - name: Rodar o time de agentes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail   # falha do claude não pode ser mascarada pelo tee
          DATA="${{ github.event.inputs.data_ref }}"
          if [ -z "$DATA" ]; then DATA=$(date -u +%F); fi
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          claude -p "/gerar-boletim $DATA" \
            --allowedTools "Bash,Read,Write,Edit,Agent" \
            2>&1 | tee logs/execucao.log

      - name: Configurar identidade do bot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit e push dos produtos gerados
        run: |
          # Busca os arquivos gerados em qualquer subdiretório da árvore de
          # trabalho — o agente pode colocar o .qmd (e o HTML resultante) em
          # subpastas como output/ em vez da raiz, então não assumimos local fixo.
          HTML_FOUND=$(find . -name "boletim_${DATA}.html" -not -path "./.git/*" 2>/dev/null | head -1)
          PDF_FOUND=$(find . -name "boletim_${DATA}.pdf" -not -path "./.git/*" 2>/dev/null | head -1)

          if [ -z "$HTML_FOUND" ] || [ ! -s "$HTML_FOUND" ]; then
            echo "::error::Arquivo boletim_${DATA}.html não encontrado na árvore de trabalho. A pipeline relatou sucesso, mas o produto não foi gerado."
            python python/registrar_erro.py "workflow" "Commit e push: boletim_${DATA}.html ausente ou vazio." || true
            exit 1
          fi
          if [ -z "$PDF_FOUND" ] || [ ! -s "$PDF_FOUND" ]; then
            echo "::error::Arquivo boletim_${DATA}.pdf não encontrado na árvore de trabalho. A pipeline relatou sucesso, mas o produto não foi gerado."
            python python/registrar_erro.py "workflow" "Commit e push: boletim_${DATA}.pdf ausente ou vazio." || true
            exit 1
          fi

          echo "HTML encontrado em: $HTML_FOUND"
          echo "PDF encontrado em: $PDF_FOUND"
          cp "$HTML_FOUND" index.html
          cp "$PDF_FOUND" boletim_latest.pdf

          # Registra o mes do IPCA que ESTE boletim incorporou. E o que impede
          # o gatilho do IPCA de disparar de novo amanha pelo mesmo dado.
          if python python/ipca_referencia.py --valor > referencia_ipca.txt.novo; then
            mv referencia_ipca.txt.novo referencia_ipca.txt
            echo "Referencia do IPCA registrada: $(cat referencia_ipca.txt)"
          else
            rm -f referencia_ipca.txt.novo
            echo "::warning::Nao foi possivel registrar a referencia do IPCA. O gatilho pode disparar de novo na proxima janela; o portao semanal segue intacto."
          fi

          git add logs/revisao.md logs/erros.md 2>/dev/null || true
          git add index.html boletim_latest.pdf referencia_ipca.txt

          if git diff --staged --quiet; then
            echo "Nada a publicar nesta rodada."
          else
            git commit -m "Boletim macro $DATA [bot]"
            git push
          fi

      - name: Anexar logs como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

      - name: Notificar falha via GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA=$(date -u +%F)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Corpo via heredoc: todas as linhas ficam na indentacao do bloco YAML,
          # que o parser remove, entregando o markdown sem espacos a esquerda.
          cat > "$RUNNER_TEMP/corpo_issue.md" <<EOF
          O workflow **${{ github.workflow }}** falhou na execucao de $DATA.

          [Ver logs do run]($RUN_URL)
          EOF

          # Sem '2>/dev/null' e sem '|| true': se a notificacao falhar, o motivo real
          # (403 por falta de escopo, label inexistente etc.) precisa aparecer no log,
          # em vez de uma mensagem generica que esconde a causa.
          if gh issue create --title "Falha no Boletim Macro $DATA" --body-file "$RUNNER_TEMP/corpo_issue.md" --label "bug"; then
            echo "Issue de falha criada."
          else
            echo "::warning::Nao foi possivel criar a issue com o label 'bug' (motivo acima). Tentando sem label."
            gh issue create --title "Falha no Boletim Macro $DATA" --body-file "$RUNNER_TEMP/corpo_issue.md"
          fi
